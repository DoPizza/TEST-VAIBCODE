
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>УлДвиж — мероприятия Ульяновска</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f2f2;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #events {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 20px;
        }

        .event-card {
            background: white;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }

        .event-image-wrapper {
            width: 100%;
            height: 220px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            background: #eeeeee;

            border-radius: 10px;

            overflow: hidden;

            cursor: pointer;
        }

        .event-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            transition:
                transform 0.2s ease;
        }

        .event-image-wrapper:hover
        .event-image {
            transform: scale(1.03);
        }

        .no-image {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #888;

            font-size: 16px;
        }

        .event-title {
            margin: 0 0 10px;

            font-size: 22px;

            line-height: 1.25;
        }

        .event-description {
            margin-bottom: 15px;

            line-height: 1.5;

            color: #555;
        }

        .event-status {
            display: inline-block;

            padding: 5px 10px;

            margin-bottom: 12px;

            border-radius: 20px;

            background: #eeeeee;

            font-size: 14px;

            font-weight: bold;
        }

        .event-date {
            margin-bottom: 10px;

            font-weight: bold;

            line-height: 1.5;
        }

        .event-price {
            margin-bottom: 10px;

            font-weight: bold;
        }

        .event-info {
            margin-top: 10px;
            margin-bottom: 10px;

            line-height: 1.5;

            color: #444;
        }

        .event-info a {
            color: inherit;

            font-weight: bold;

            text-decoration: none;
        }

        .event-info a:hover {
            text-decoration: underline;
        }

        .age-limit {
            display: inline-block;

            margin-top: 5px;
            margin-right: 5px;

            padding: 5px 9px;

            border-radius: 6px;

            background: #ffe0e0;

            color: #c00;

            font-size: 14px;

            font-weight: bold;
        }

        .event-type {
            display: inline-block;

            margin-top: 5px;

            padding: 5px 9px;

            border-radius: 6px;

            background: #eeeeee;

            color: #555;

            font-size: 14px;

            font-weight: bold;
        }

        .event-warning {
            margin-top: 12px;

            padding: 10px;

            border-radius: 8px;

            background: #fff3cd;

            color: #856404;

            line-height: 1.4;

            font-size: 14px;
        }

        .event-source {
            margin-top: 15px;

            padding-top: 10px;

            border-top:
                1px solid #eeeeee;

            font-size: 14px;

            color: #777;
        }

        .event-source a {
            color: #555;

            text-decoration: none;
        }

        .event-source a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;

            padding: 40px;

            color: #777;
        }

        .error {
            text-align: center;

            padding: 30px;

            color: #c00;

            background: #ffeaea;

            border-radius: 10px;
        }


        /* ======================================
           МОДАЛЬНОЕ ОКНО ИЗОБРАЖЕНИЯ
           ====================================== */

        .image-modal {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.88);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 9999;

            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-image {
            max-width: 95%;
            max-height: 95%;

            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.5);
        }

        .image-modal-close {
            position: absolute;

            top: 15px;
            right: 25px;

            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 40px;

            cursor: pointer;

            user-select: none;

            z-index: 10000;
        }

        .image-modal-close:hover {
            opacity: 0.7;
        }


        /* ======================================
           МОБИЛЬНАЯ ВЕРСИЯ
           ====================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 26px;
            }

            #events {
                grid-template-columns: 1fr;
            }

            .event-image-wrapper {
                height: 180px;
            }

            .event-title {
                font-size: 20px;
            }

            .image-modal {
                padding: 10px;
            }

            .modal-image {
                max-width: 100%;
                max-height: 90%;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            УлДвиж — мероприятия Ульяновска
        </h1>

        <div id="events">

            <div class="loading">
                Загрузка мероприятий...
            </div>

        </div>

    </div>


    <!-- ======================================
         МОДАЛЬНОЕ ОКНО
         ====================================== -->

    <div
        id="image-modal"
        class="image-modal"
    >

        <div
            id="image-modal-close"
            class="image-modal-close"
        >
            ×
        </div>

        <img
            id="modal-image"
            class="modal-image"
            src=""
            alt="Увеличенное изображение"
        >

    </div>


    <script>

        const BACKEND_URL =
            "https://astonishing-pastelito-e6e568.netlify.app/api/events/approved";


        // ======================================
        // ЭКРАНИРОВАНИЕ HTML
        // ======================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ======================================
        // ФОРМАТИРОВАНИЕ ДАТЫ
        // ======================================

        function formatDate(dateString) {

            if (!dateString) {
                return "Дата не указана";
            }

            const date =
                new Date(dateString);

            if (
                isNaN(
                    date.getTime()
                )
            ) {
                return "Некорректная дата";
            }

            return date.toLocaleString(
                "ru-RU",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // ======================================
        // ОБРАТНЫЙ ОТСЧЁТ
        // ======================================

        function formatStartDate(dateString) {

            if (!dateString) {
                return "📅 Дата не указана";
            }

            const date =
                new Date(dateString);

            if (
                isNaN(
                    date.getTime()
                )
            ) {
                return "📅 Некорректная дата";
            }

            const now =
                new Date();

            const difference =
                date.getTime() -
                now.getTime();


            if (difference <= 0) {

                return "🔴 Уже началось";

            }


            const minutes =
                Math.floor(
                    difference /
                    (1000 * 60)
                );

            const hours =
                Math.floor(
                    minutes / 60
                );

            const days =
                Math.floor(
                    hours / 24
                );


            if (days > 1) {

                return `📅 Начнётся через ${days} дней`;

            }


            if (days === 1) {

                return "📅 Начнётся через 1 день";

            }


            if (hours > 1) {

                return `⏰ Начнётся через ${hours} часов`;

            }


            if (hours === 1) {

                return "⏰ Начнётся через 1 час";

            }


            if (minutes > 1) {

                return `⏱️ Начнётся через ${minutes} минут`;

            }


            if (minutes === 1) {

                return "⏱️ Начнётся через 1 минуту";

            }


            return "⏱️ Начнётся совсем скоро";

        }


        // ======================================
        // ОТКРЫТИЕ ИЗОБРАЖЕНИЯ
        // ======================================

        function openImage(url) {

            if (!url) {
                return;
            }

            const modal =
                document.getElementById(
                    "image-modal"
                );

            const modalImage =
                document.getElementById(
                    "modal-image"
                );

            modalImage.src = url;

            modal.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

        }


        // ======================================
        // ЗАКРЫТИЕ ИЗОБРАЖЕНИЯ
        // ======================================

        function closeImage() {

            const modal =
                document.getElementById(
                    "image-modal"
                );

            const modalImage =
                document.getElementById(
                    "modal-image"
                );

            modal.classList.remove(
                "active"
            );

            modalImage.src = "";

            document.body.style.overflow =
                "";

        }


        // ======================================
        // ЗАГРУЗКА МЕРОПРИЯТИЙ
        // ======================================

        async function loadEvents() {

            const container =
                document.getElementById(
                    "events"
                );

            try {

                const response =
                    await fetch(
                        BACKEND_URL
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const events =
                    await response.json();


                if (
                    !Array.isArray(events) ||
                    events.length === 0
                ) {

                    container.innerHTML = `

                        <div class="loading">
                            Мероприятий пока нет
                        </div>

                    `;

                    return;

                }


                container.innerHTML =
                    events.map(
                        event => {


                            // ======================================
                            // ИЗОБРАЖЕНИЕ
                            // ======================================

                            let imageHTML = "";


                            if (
                                event.image_url &&
                                String(
                                    event.image_url
                                ).trim() !== ""
                            ) {

                                const imageUrl =
                                    escapeHTML(
                                        event.image_url
                                    );

                                const imageTitle =
                                    escapeHTML(
                                        event.title ||
                                        "Изображение мероприятия"
                                    );

                                imageHTML = `

                                    <div
                                        class="event-image-wrapper"
                                        onclick="openImage('${imageUrl}')"
                                    >

                                        <img
                                            class="event-image"
                                            src="${imageUrl}"
                                            alt="${imageTitle}"
                                            onerror="this.parentElement.innerHTML='<div class=no-image>🖼️ Ошибка загрузки изображения</div>'"
                                        >

                                    </div>

                                `;

                            } else {

                                imageHTML = `

                                    <div
                                        class="event-image-wrapper"
                                    >

                                        <div class="no-image">
                                            🖼️ Нет изображения
                                        </div>

                                    </div>

                                `;

                            }


                            // ======================================
                            // ВЕЩАТЕЛЬ / ОРГАНИЗАТОР
                            // ======================================

                            let broadcasterHTML = "";


                            if (
                                event.broadcaster &&
                                String(
                                    event.broadcaster
                                ).trim() !== ""
                            ) {

                                const broadcaster =
                                    escapeHTML(
                                        event.broadcaster
                                    );


                                if (
                                    event.broadcaster_url &&
                                    String(
                                        event.broadcaster_url
                                    ).trim() !== ""
                                ) {

                                    broadcasterHTML = `

                                        <div
                                            class="event-info"
                                        >

                                            📢 Организатор:

                                            <a
                                                href="${escapeHTML(event.broadcaster_url)}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                            >
                                                ${broadcaster}
                                            </a>

                                        </div>

                                    `;

                                } else {

                                    broadcasterHTML = `

                                        <div
                                            class="event-info"
                                        >

                                            📢 Организатор:

                                            <b>
                                                ${broadcaster}
                                            </b>

                                        </div>

                                    `;

                                }

                            }


                            // ======================================
                            // ВОЗРАСТ
                            // ======================================

                            let ageHTML = "";


                            if (
                                event.age !== null &&
                                event.age !== undefined &&
                                event.age !== "" &&
                                Number(event.age) > 0
                            ) {

                                ageHTML = `

                                    <div
                                        class="age-limit"
                                    >
                                        🔞 ${escapeHTML(event.age)}+
                                    </div>

                                `;

                            }


                            // ======================================
                            // ТИП
                            // ======================================

                            let typeHTML = "";


                            if (
                                event.type &&
                                String(
                                    event.type
                                ).trim() !== ""
                            ) {

                                typeHTML = `

                                    <div
                                        class="event-type"
                                    >
                                        🎭 ${escapeHTML(event.type)}
                                    </div>

                                `;

                            }


                            // ======================================
                            // ЦЕНА
                            // ======================================

                            let priceHTML = "";


                            if (
                                event.price !== null &&
                                event.price !== undefined &&
                                event.price !== ""
                            ) {

                                const price =
                                    Number(
                                        event.price
                                    );


                                if (
                                    !isNaN(price)
                                ) {

                                    priceHTML = `

                                        <div
                                            class="event-price"
                                        >
                                            💰 ${price.toLocaleString("ru-RU")} ₽
                                        </div>

                                    `;

                                }

                            }


                            // ======================================
                            // АДРЕС
                            // ======================================

                            let addressHTML = "";


                            if (
                                event.address &&
                                String(
                                    event.address
                                ).trim() !== ""
                            ) {

                                addressHTML = `

                                    <div
                                        class="event-info"
                                    >

                                        📍 ${escapeHTML(event.address)}

                                    </div>

                                `;

                            }


                            // ======================================
                            // ДАТА
                            // ======================================

                            let dateHTML = "";


                            if (
                                event.start_date
                            ) {

                                dateHTML = `

                                    <div
                                        class="event-date"
                                    >

                                        ${formatStartDate(
                                            event.start_date
                                        )}

                                        <br>

                                        📅 ${formatDate(
                                            event.start_date
                                        )}

                                    </div>

                                `;

                            }


                            // ======================================
                            // ДАТА ОКОНЧАНИЯ
                            // ======================================

                            let endDateHTML = "";


                            if (
                                event.end_date
                            ) {

                                endDateHTML = `

                                    <div
                                        class="event-info"
                                    >

                                        🏁 Окончание:

                                        ${formatDate(
                                            event.end_date
                                        )}

                                    </div>

                                `;

                            }


                            // ======================================
                            // ПРЕДУПРЕЖДЕНИЕ
                            // ======================================

                            let warningHTML = "";


                            if (
                                event.warning &&
                                String(
                                    event.warning
                                ).trim() !== ""
                            ) {

                                warningHTML = `

                                    <div
                                        class="event-warning"
                                    >

                                        ⚠️
                                        ${escapeHTML(event.warning)}

                                    </div>

                                `;

                            }


                            // ======================================
                            // ИСТОЧНИК
                            // ======================================

                            
                            let sourceHTML = "";
                            
                            
                            if (
                                event.source_url &&
                                String(
                                    event.source_url
                                ).trim() !== ""
                            ) {
                            
                                const sourceName =
                                    event.source ||
                                    "Источник";
                            
                                sourceHTML = `
                            
                                    <div
                                        class="event-source"
                                    >
                            
                                        🔗 Источник:
                            
                                        <a
                                            href="${escapeHTML(event.source_url)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            ${escapeHTML(sourceName)}
                                        </a>
                            
                                    </div>
                            
                                `;
                            
                            } else if (
                                event.source &&
                                String(
                                    event.source
                                ).trim() !== ""
                            ) {
                            
                                sourceHTML = `
                            
                                    <div
                                        class="event-source"
                                    >
                            
                                        🔗 Источник:
                                        ${escapeHTML(event.source)}
                            
                                    </div>
                            
                                `;
                            
                            }
                            
                            
                            /* ======================================
                               ВТОРОЙ ИСТОЧНИК
                               ====================================== */
                            
                            let source2HTML = "";
                            
                            
                            if (
                                event.source2_url &&
                                String(
                                    event.source2_url
                                ).trim() !== ""
                            ) {
                            
                                const source2Name =
                                    event.source2 ||
                                    "Дополнительный источник";
                            
                                source2HTML = `
                            
                                    <div
                                        class="event-source"
                                    >
                            
                                        🔗 Доп. источник:
                            
                                        <a
                                            href="${escapeHTML(event.source2_url)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            ${escapeHTML(source2Name)}
                                        </a>
                            
                                    </div>
                            
                                `;
                            
                            } else if (
                                event.source2 &&
                                String(
                                    event.source2
                                ).trim() !== ""
                            ) {
                            
                                source2HTML = `
                            
                                    <div
                                        class="event-source"
                                    >
                            
                                        🔗 Доп. источник:
                                        ${escapeHTML(event.source2)}
                            
                                    </div>
                            
                                `;
                            
                            }

                            // ======================================
                            // КАРТОЧКА
                            // ======================================

                            return `

                                <div
                                    class="event-card"
                                >

                                    ${imageHTML}


                                    <h2
                                        class="event-title"
                                    >
                                        ${
                                            escapeHTML(
                                                event.title ||
                                                "Без названия"
                                            )
                                        }
                                    </h2>





                                    ${
                                        event.description
                                        ? `

                                            <div
                                                class="event-description"
                                            >
                                                ${escapeHTML(
                                                    event.description
                                                )}
                                            </div>

                                        `
                                        : ""
                                    }


                                    ${dateHTML}


                                    ${priceHTML}

                                    ${addressHTML}

                                    ${broadcasterHTML}


                                    <div>

                                        ${ageHTML}

                                        ${typeHTML}

                                    </div>


                                    ${warningHTML}

                                    ${sourceHTML}

                                    ${source2HTML}

                                </div>

                            `;

                        }
                    ).join("");


            } catch (error) {

                console.error(
                    "Ошибка загрузки мероприятий:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        ❌ Не удалось загрузить мероприятия

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        // ======================================
        // ЗАКРЫТИЕ ПО КНОПКЕ X
        // ======================================

        document
            .getElementById(
                "image-modal-close"
            )
            .addEventListener(
                "click",
                closeImage
            );


        // ======================================
        // ЗАКРЫТИЕ ПО КЛИКУ НА ФОН
        // ======================================

        document
            .getElementById(
                "image-modal"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeImage();

                    }

                }
            );


        // ======================================
        // ЗАКРЫТИЕ ПО ESC
        // ======================================

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeImage();

                }

            }
        );


        // ======================================
        // ПЕРВОНАЧАЛЬНАЯ ЗАГРУЗКА
        // ======================================

        loadEvents();


        // ======================================
        // ОБНОВЛЕНИЕ КАЖДУЮ МИНУТУ
        // ======================================

        setInterval(
            () => {
                loadEvents();
            },
            60000
        );

    </script>

</body>

</html>
